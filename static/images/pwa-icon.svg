<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131a"/>
      <stop offset="50%" stop-color="#182030"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#blueGrad)" stroke-width="4" opacity="0.4"/>
  
  <!-- LoL Hextech Emblem -->
  <g filter="url(#glow)">
    <!-- Wings -->
    <path d="M 170 215 L 100 185 L 115 250 Z" fill="#E84057" opacity="0.9"/>
    <path d="M 342 215 L 412 185 L 397 250 Z" fill="#E84057" opacity="0.9"/>
    
    <!-- Outer Diamond -->
    <polygon points="256,120 330,215 256,310 182,215" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Inner Core Diamond -->
    <polygon points="256,165 295,215 256,265 217,215" fill="url(#blueGrad)"/>
    <circle cx="256" cy="215" r="8" fill="#FFFFFF"/>
  </g>
  
  <!-- Typography carry.gg -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">carry.gg</text>
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-weight="700" font-size="22" fill="#38BDF8" text-anchor="middle" letter-spacing="6">KR PRO STATS</text>
</svg>